<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200">

  <defs>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B2FBE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9457A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradSymbol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B2FBE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9457A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="620" height="200" fill="#FFFFFF"/>

  <!-- Claude-like symbol: open rounded ring with gradient, drawn as a plain donut path -->
  <!-- (avoids <mask>, which some mobile browsers rasterize at a fixed resolution and render blurry) -->
  <path
    fill-rule="evenodd"
    fill="url(#gradSymbol)"
    d="M44,95 a46,46 0 1,0 92,0 a46,46 0 1,0 -92,0 Z M62,95 a28,28 0 1,0 56,0 a28,28 0 1,0 -56,0 Z"
  />
  <!-- Gap/notch at top-right to mimic the open ring, painted in the background white -->
  <rect x="110" y="49" width="36" height="22" rx="11" fill="#FFFFFF" transform="rotate(45 128 60)"/>
  <!-- Inner dot in center -->
  <circle cx="90" cy="95" r="8" fill="url(#gradSymbol)"/>

  <!-- SmartKI text -->
  <text
    x="168" y="108"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="62" font-weight="500" letter-spacing="-1"
    fill="#231F20"
  >Smart<tspan fill="url(#gradText)">KI</tspan></text>

  <!-- Gradient horizontal line -->
  <rect x="168" y="122.25" width="422" height="1.5" fill="url(#gradText)"/>

  <!-- AUTOMATION subtext, gradient fill applied directly to the text -->
  <!-- Sized/weighted up from the original 22px/600 so it stays legible once the logo is
       shrunk to mobile header height (was unreadably small on phones) -->
  <text
    x="170" y="164"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="34" font-weight="700" letter-spacing="5"
    fill="url(#gradText)"
  >AUTOMATION</text>

</svg>
